<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Eco-Quiz - Eco Start-Up Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Giriş Ekranı -->
        <div id="welcome-screen" class="screen">
            <h1>🌿 Eco Start-Up Club</h1>
            <h2>Eco-Quiz (Eko-Bilik Viktorinası)</h2>
            <input type="text" id="username" placeholder="Adınızı daxil edin...">
            <button onclick="startQuiz()">Oyuna Başla</button>
        </div>

        <!-- Sual Ekranı -->
        <div id="quiz-screen" class="screen" style="display: none;">
            <h2 id="question-text">Sual burada olacaq</h2>
            <div id="options-container"></div>
        </div>

        <!-- Nəticə Ekranı -->
        <div id="result-screen" class="screen" style="display: none;">
            <h2 id="result-title">Oyun Bitdi!</h2>
            <p id="score-text"></p>
            <p id="status-text"></p>
            <button onclick="restartQuiz()">Yenidən Başla</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
